name: Native release

# Tag native-vX.Y.Z to build the Raspberry Pi programs and publish them: a static binary per Pi family, a .deb each, checksums, and (when the
# NATIVE_SIGNING_KEY secret holds an ed25519 private key in PEM) a signature of each. The web page is unaffected by these tags.

on:
  push:
    tags: ['native-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Version from the tag
        run: |
          echo "VERSION=$(echo "${GITHUB_REF_NAME:-native-v0.0.0}" | sed 's/^native-v//')" >> "$GITHUB_ENV"
      - name: Tests
        run: |
          rustup target add arm-unknown-linux-musleabihf aarch64-unknown-linux-musl
          (cd native && cargo test)
      - name: Build
        run: |
          # cargo reads native/.cargo/config.toml (the linker for the static targets) from the directory it runs in
          cd native
          cargo build --release --target arm-unknown-linux-musleabihf
          cargo build --release --target aarch64-unknown-linux-musl
      - name: Package
        run: |
          mkdir -p dist
          # the names the update script looks for (wobbly-clock-run-armv6, -aarch64), LATEST, and a .deb each
          cp native/target/arm-unknown-linux-musleabihf/release/wobbly-clock-run dist/wobbly-clock-run-armv6
          cp native/target/aarch64-unknown-linux-musl/release/wobbly-clock-run dist/wobbly-clock-run-aarch64
          echo "$VERSION" > dist/LATEST
          native/scripts/make-deb.sh armhf dist/wobbly-clock-run-armv6 "$VERSION" dist
          native/scripts/make-deb.sh arm64 dist/wobbly-clock-run-aarch64 "$VERSION" dist
          (cd dist && sha256sum * > SHA256SUMS)
      - name: Sign (when a key is configured)
        env:
          KEY: ${{ secrets.NATIVE_SIGNING_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            printf '%s\n' "$KEY" > "$RUNNER_TEMP/key.pem"
            for f in dist/wobbly-clock-run-armv6 dist/wobbly-clock-run-aarch64 dist/*.deb; do openssl pkeyutl -sign -rawin -inkey "$RUNNER_TEMP/key.pem" -in "$f" | base64 -w0 > "$f.sig"; done
            rm -f "$RUNNER_TEMP/key.pem"
          else
            echo "No NATIVE_SIGNING_KEY secret: publishing checksums only."
          fi
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "Native $VERSION" \
            --notes "Static Raspberry Pi programs. wobbly-clock-run for ARMv6 (every 32-bit Pi) and aarch64, with a .deb each. Verify with SHA256SUMS (and the .sig files with the release key). wobbly-clock-update, installed by the .deb, reads LATEST and these files." 
