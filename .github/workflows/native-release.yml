name: Native release

# Tag native-vX.Y.Z to build the Raspberry Pi programs and publish them: a program per Pi family, a .deb each, checksums, and (when the
# NATIVE_SIGNING_KEY secret holds an ed25519 private key in PEM) a signature of each. The web page is unaffected by these tags.

on:
  push:
    tags: ['native-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'The version to release, for example 0.2.0 (the tag native-v0.2.0 is created on the branch this runs on)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Version from the tag
        run: |
          V="${{ github.event.inputs.version }}"
          [ -n "$V" ] || V="$(echo "${GITHUB_REF_NAME:-native-v0.0.0}" | sed 's/^native-v//')"
          case "$V" in [0-9]*.[0-9]*.[0-9]*) ;; *) echo "not a version: $V"; exit 1 ;; esac
          echo "VERSION=$V" >> "$GITHUB_ENV"
      - name: Tests
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gcc-arm-linux-gnueabihf gcc-aarch64-linux-gnu
          pip install ziglang cargo-zigbuild
          rustup target add arm-unknown-linux-gnueabihf aarch64-unknown-linux-gnu
          (cd native && cargo test)
      - name: Build
        run: |
          # cargo reads native/.cargo/config.toml (the cross linkers) from the directory it runs in
          cd native
          export WOBBLY_NO_LIBATOMIC=1
          cargo zigbuild --release --target arm-unknown-linux-gnueabihf.2.31
          cargo zigbuild --release --target aarch64-unknown-linux-gnu.2.31
      - name: Package
        run: |
          mkdir -p dist
          # the names the update script looks for (wobbly-clock-run-armv6, -aarch64), LATEST, and a .deb each
          cp native/target/arm-unknown-linux-gnueabihf/release/wobbly-clock-run dist/wobbly-clock-run-armv6
          cp native/target/aarch64-unknown-linux-gnu/release/wobbly-clock-run dist/wobbly-clock-run-aarch64
          echo "$VERSION" > dist/LATEST
          native/scripts/make-deb.sh armhf dist/wobbly-clock-run-armv6 "$VERSION" dist
          native/scripts/make-deb.sh arm64 dist/wobbly-clock-run-aarch64 "$VERSION" dist
          (cd dist && sha256sum * > SHA256SUMS)
      - name: Sign (when a key is configured)
        env:
          KEY: ${{ secrets.NATIVE_SIGNING_KEY }}
          PUBKEY: native/release-key.pem
        run: |
          if [ -n "$KEY" ]; then
            native/scripts/sign-release.sh dist/wobbly-clock-run-armv6 dist/wobbly-clock-run-aarch64 dist/*.deb
          elif [ -f native/release-key.pem ]; then
            # the programs carry the public key (the .deb installs it) and the update script then refuses anything unsigned: an unsigned release would strand every clock that installed it
            echo "::error::native/release-key.pem is in the repository but the NATIVE_SIGNING_KEY secret is empty here. Save the private key as a REPOSITORY secret named NATIVE_SIGNING_KEY (Settings > Secrets and variables > Actions > Repository secrets; not an environment or Dependabot secret), then run this again."
            exit 1
          else
            echo "No NATIVE_SIGNING_KEY secret and no release key: publishing checksums only."
          fi
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # a run that failed half way can leave a draft with this tag: it is removed (a published release is never touched)
          if [ "$(gh release view "native-v$VERSION" --json isDraft -q .isDraft 2>/dev/null)" = true ]; then gh release delete "native-v$VERSION" --yes --cleanup-tag; fi
          gh release create "native-v$VERSION" --target "$GITHUB_SHA" dist/* --title "Native $VERSION" \
            --notes "Raspberry Pi programs (the web page's own code, run without a browser). wobbly-clock-run for ARMv6 (every 32-bit Pi) and aarch64, with a .deb each. Verify with SHA256SUMS (and the .sig files with the release key). wobbly-clock-update, installed by the .deb, reads LATEST and these files." 
