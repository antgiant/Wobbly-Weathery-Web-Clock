name: Native

# The native (Raspberry Pi) version: its command line is tested by the unit tests in ci.yml (tests/unit/native-*.test.mjs). This workflow adds
# what needs more tools: the man pages are linted with mandoc, and the command line is run for real. Runs only when native/, schema/ or the
# share-link code change.

on:
  push:
    paths: ['native/**', 'js/sky/**', 'js/vendor/**', 'data/**', 'docs/LED-PANELS.md', 'schema/**', 'js/share.js', 'js/countdown.js', 'js/sky/dim.js', 'js/easing.js', 'js/config.js', 'tools/native-*.mjs', '.github/workflows/native.yml']
  pull_request:
    paths: ['native/**', 'js/sky/**', 'js/vendor/**', 'data/**', 'docs/LED-PANELS.md', 'schema/**', 'js/share.js', 'js/countdown.js', 'js/sky/dim.js', 'js/easing.js', 'js/config.js', 'tools/native-*.mjs', '.github/workflows/native.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cli:
    name: Man pages and command line
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Man pages are current
        run: node tools/native-man.mjs --check
      - name: Lint the man pages
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq mandoc
          mandoc -Tlint -Wwarning native/man/wobbly-clock.1 native/man/wobbly-clock.conf.5
      - name: The command line runs
        env:
          WOBBLY_CONFIG: ${{ runner.temp }}/wc/wobbly-clock.conf
        run: |
          node native/cli/main.mjs --version
          node native/cli/main.mjs preset bedside
          node native/cli/main.mjs set hideSeconds on
          node native/cli/main.mjs get
          node native/cli/main.mjs capabilities
          mandoc -Tutf8 native/man/wobbly-clock.conf.5 | head -40

  host:
    name: The native host draws what the browser draws
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Install the GPU libraries the host loads (Mesa)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgles2 libgl1-mesa-dri
      - name: Build the host
        run: cargo build --release -p wobbly-clock-run --manifest-path native/Cargo.toml
      - name: One sky, drawn by the host and by Chromium
        # softpipe is Mesa's slow but exact software renderer: llvmpipe miscompiles some of the engine's integer noise code on some versions,
        # which is a fault of that renderer, not of the shaders (the Raspberry Pi drivers are not affected: they are checked on real hardware)
        env:
          GALLIUM_DRIVER: softpipe
        run: |
          native/target/release/wobbly-clock-run . "$RUNNER_TEMP/host.ppm" 480 270
          node native/host/tests/chromium-frame.mjs "$RUNNER_TEMP/chrome.ppm"
          node native/host/tests/ppm-diff.mjs "$RUNNER_TEMP/host.ppm" "$RUNNER_TEMP/chrome.ppm" 8 "$RUNNER_TEMP/diff.ppm" --max-mean 1 --max-over 0.5
      - name: The same 2D drawing (glass-mask style), drawn by the host and by Chromium
        run: |
          WOBBLY_SCRIPT=native/host/tests/canvas-host.js native/target/release/wobbly-clock-run . "$RUNNER_TEMP/c2d-host.ppm"
          node native/host/tests/chromium-canvas.mjs "$RUNNER_TEMP/c2d-chrome.ppm"
          node native/host/tests/ppm-diff.mjs "$RUNNER_TEMP/c2d-host.ppm" "$RUNNER_TEMP/c2d-chrome.ppm" 8 "$RUNNER_TEMP/c2d-diff.ppm" --max-mean 0.5 --max-over 1
      - name: The whole page (sky, ground, Liquid Glass digits), run by the host and by Chromium
        env:
          GALLIUM_DRIVER: softpipe
        run: |
          CONF='{"plants":false,"landscape":"hills","antiBurnIn":"off"}'
          WOBBLY_STORE="$RUNNER_TEMP/store.json" native/target/release/wobbly-clock-run . "$RUNNER_TEMP/app-host.ppm" --app --w=480 --h=270 "--search=t=2026-06-21T17:00:00Z&speed=0&lat=40.7&lon=-74&weather=clear" --out="$RUNNER_TEMP/app-host.ppm" --frames=2 --tz=UTC --seed=1 --offline=1 "--conf=$CONF"
          node native/host/tests/app-chromium.mjs "$RUNNER_TEMP/app-chrome.ppm" 480 270 "t=2026-06-21T17:00:00Z&speed=0&lat=40.7&lon=-74&weather=clear" "$CONF"
          node native/host/tests/ppm-diff.mjs "$RUNNER_TEMP/app-host.ppm" "$RUNNER_TEMP/app-chrome.ppm" 12 "$RUNNER_TEMP/app-diff.ppm" --max-mean 1.5 --max-over 1
      - name: The OpenGL ES 2 form of every shader compiles (GLSL ES 1.00), and data/noise.bin is the noise the shader makes
        env:
          GALLIUM_DRIVER: softpipe
        run: |
          WOBBLY_SCRIPT=native/host/tests/es1-compile.js native/target/release/wobbly-clock-run . "$RUNNER_TEMP/x.ppm" 64 36
          WOBBLY_SCRIPT=native/host/tests/noise-check.js native/target/release/wobbly-clock-run . "$RUNNER_TEMP/x.ppm" 64 36
      - name: The ES 2 path (what a Pi Zero or 3 runs) draws what the ES 3 path draws, by day and at dusk
        env:
          GALLIUM_DRIVER: softpipe
        run: |
          CONF='{"plants":true,"landscape":"hills","antiBurnIn":"off","cloudMotion":"0"}'
          # (dusk: the sky's light comes from the edge of the earth's shadow, where a table read that blends a dark texel with a lit one the wrong way comes out far too dim)
          for pair in day:2026-06-21T17:00:00Z dusk:2026-06-22T01:10:00Z; do
            name="${pair%%:*}"; when="${pair#*:}"          # (no colons in the picture's name: an artifact's file names cannot have them)
            for m in 3 2; do
              EXTRA=""; [ $m = 2 ] && EXTRA="--es2=1"
              WOBBLY_STORE="$RUNNER_TEMP/store.json" native/target/release/wobbly-clock-run . "$RUNNER_TEMP/es$m-$name.ppm" --app $EXTRA --w=480 --h=270 "--search=t=$when&speed=0&lat=40.7&lon=-74&weather=clear" --out="$RUNNER_TEMP/es$m-$name.ppm" --frames=2 --tz=UTC --seed=1 --offline=1 "--conf=$CONF"
            done
            echo "$name ($when)"
            node native/host/tests/ppm-diff.mjs "$RUNNER_TEMP/es3-$name.ppm" "$RUNNER_TEMP/es2-$name.ppm" 12 "$RUNNER_TEMP/es-diff-$name.ppm" --max-mean 1.5 --max-over 2
          done
      - name: Soak - time-warped hours of running leave memory and canvases flat
        run: |
          set -e
          printf 'weatherMode = rain\nlocation_latitude = 40.7\nlocation_longitude = -74\ntimeZone = UTC\nplants = off\n' > soak.conf
          timeout 240 native/target/release/wobbly-clock-run --config soak.conf --sink ppm:/tmp/soak --size 160x90 --timewarp 3600 --health 60 --software 1 2>&1 | grep '^health' | tee soak.txt || true
          node -e "const L=require('fs').readFileSync('soak.txt','utf8').trim().split('\n').map(l=>({rss:+/rss (\d+)/.exec(l)[1],cv:+/canvases (\d+)/.exec(l)[1]}));if(L.length<8)throw new Error('too few health lines: '+L.length);const r=L.map(x=>x.rss),h=Math.floor(L.length/2);const a=Math.max(...r.slice(0,h)),b=Math.max(...r.slice(h));console.log('rss first half max',a,'second half max',b,'canvases max',Math.max(...L.map(x=>x.cv)));if(b>a+25)throw new Error('memory grows');if(Math.max(...L.map(x=>x.cv))>80)throw new Error('canvases are not freed')"
      - name: The GPU test runs (on the CPU renderer here; it is for the Pi)
        run: native/target/release/wobbly-clock-run --gpu-test 2>&1 | tee "$RUNNER_TEMP/gputest.log" | tail -5; grep -q "=== done ===" "$RUNNER_TEMP/gputest.log"
      - name: "A GPU without OpenGL ES 3 (Pi 3, Zero): the program restarts with software rendering and still draws"
        run: |
          cat > "$RUNNER_TEMP/fb.conf" <<'CONF'
          location_latitude = 40.7
          location_longitude = -74
          weatherMode = clear
          plants = off
          CONF
          WOBBLY_FAKE_NO_ES3=1 native/target/release/wobbly-clock-run --config "$RUNNER_TEMP/fb.conf" --sink "ppm:$RUNNER_TEMP/sw" --size 160x90 --frames 1 --at 1782061200000 2>&1 | tee "$RUNNER_TEMP/sw.log"
          grep -q "drawing on the CPU" "$RUNNER_TEMP/sw.log"
          ls "$RUNNER_TEMP"/sw/frame-0000.ppm
      - name: "The pills (sun countdown, umbrella alert, countdown name) are painted into the picture"
        run: |
          set -e
          cat > "$RUNNER_TEMP/pills.conf" <<'CONF'
          weatherMode = rain
          rainAlert = true
          countdown = both
          countdownLead = 30
          location_latitude = 41.88
          location_longitude = -87.63
          timeZone = America/Chicago
          clockMode = countdown
          timerTarget = 2027-01-01T00:00
          timerLabel = New Year's Eve party at the lake house
          CONF
          mkdir -p "$RUNNER_TEMP/pills"
          timeout 240 native/target/release/wobbly-clock-run --config "$RUNNER_TEMP/pills.conf" --software 1 --sink "ppm:$RUNNER_TEMP/pills" --size 1280x720 --frames 45 --at 1782091200000 --timing 1 > "$RUNNER_TEMP/pills.log" 2>&1 || { tail -20 "$RUNNER_TEMP/pills.log"; exit 1; }
          node native/host/tests/pills-check.mjs "$RUNNER_TEMP/pills.log" "$(ls "$RUNNER_TEMP"/pills/frame-*.ppm | tail -1)"
          cp "$(ls "$RUNNER_TEMP"/pills/frame-*.ppm | tail -1)" "$RUNNER_TEMP/pills-last.ppm"
      - name: "An LED panel (32 x 64: two 32 x 32 panels, one above the other) gets the LED card and no pills"
        run: |
          set -e
          cat > "$RUNNER_TEMP/matrix-32x64.cfg" <<'CFG'
          display_width = 32;
          display_height = 64;
          panel_width = 32;
          panel_height = 32;
          chain_length = 2;
          parallel_count = 1;
          panels = (
            ( { order = 0; rotate = 0; } ),
            ( { order = 1; rotate = 0; } )
          )
          CFG
          cat > "$RUNNER_TEMP/led.conf" <<CONF
          output = matrix
          matrixConfig = $RUNNER_TEMP/matrix-32x64.cfg
          weatherMode = rain
          rainAlert = true
          countdown = both
          countdownLead = 30
          location_latitude = 41.88
          location_longitude = -87.63
          timeZone = America/Chicago
          clockMode = countdown
          timerTarget = 2027-01-01T00:00
          timerLabel = New Year
          CONF
          mkdir -p "$RUNNER_TEMP/led"
          timeout 240 native/target/release/wobbly-clock-run --config "$RUNNER_TEMP/led.conf" --software 1 --sink "ppm:$RUNNER_TEMP/led" --frames 45 --at 1782091200000 --timing 1 > "$RUNNER_TEMP/led.log" 2>&1 || { tail -20 "$RUNNER_TEMP/led.log"; exit 1; }
          node native/host/tests/led-check.mjs "$RUNNER_TEMP/led.log" "$(ls "$RUNNER_TEMP"/led/canvas-*.ppm | tail -1)"
          cp "$(ls "$RUNNER_TEMP"/led/canvas-*.ppm | tail -1)" "$RUNNER_TEMP/led-last.ppm"
      - name: The pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-frames
          path: ${{ runner.temp }}/*.ppm

  core:
    name: Tests (settings file, panel mapping) and builds for every Pi
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Cross tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gcc-arm-linux-gnueabihf gcc-aarch64-linux-gnu qemu-user
          pip install ziglang cargo-zigbuild
          rustup target add arm-unknown-linux-gnueabihf aarch64-unknown-linux-gnu
      - name: Tests
        run: cargo test --manifest-path native/Cargo.toml
      - name: Builds for the original Pi Zero (ARMv6, runs on every 32-bit Pi) and for 64-bit Pis, started under emulation
        run: native/scripts/cross-check.sh

  matrix-sink:
    name: The panel program compiles against the hub75 library
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build hzeller/rpi-rgb-led-matrix and compile wobbly-matrix against its real header
        run: |
          git clone --depth 1 https://github.com/hzeller/rpi-rgb-led-matrix "$RUNNER_TEMP/hz"
          make -C "$RUNNER_TEMP/hz/lib" -j2
          cc -O2 -Wall -Wextra -o "$RUNNER_TEMP/wobbly-matrix" native/matrix-sink/wobbly-matrix.c \
            -I "$RUNNER_TEMP/hz/include" -L "$RUNNER_TEMP/hz/lib" -lrgbmatrix -lstdc++ -lm -lpthread
          ls -l "$RUNNER_TEMP/wobbly-matrix"

  package:
    name: The .deb builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cross tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gcc-arm-linux-gnueabihf gcc-aarch64-linux-gnu
          pip install ziglang cargo-zigbuild
          rustup target add arm-unknown-linux-gnueabihf aarch64-unknown-linux-gnu
      - name: Build both packages and look inside them
        run: |
          # cargo reads native/.cargo/config.toml (the cross linkers) from the directory it runs in
          (cd native && WOBBLY_NO_LIBATOMIC=1 cargo zigbuild --release --target arm-unknown-linux-gnueabihf.2.31 && cargo zigbuild --release --target aarch64-unknown-linux-gnu.2.31)
          native/scripts/make-deb.sh armhf native/target/arm-unknown-linux-gnueabihf/release/wobbly-clock-run 0.0.0-ci "$RUNNER_TEMP/debs"
          native/scripts/make-deb.sh arm64 native/target/aarch64-unknown-linux-gnu/release/wobbly-clock-run 0.0.0-ci "$RUNNER_TEMP/debs"
          for d in "$RUNNER_TEMP"/debs/*.deb; do dpkg-deb -I "$d" | head -8; dpkg-deb -c "$d" | grep -E "usr/bin|service"; done
      - name: The packages, to download and try on a Pi
        uses: actions/upload-artifact@v4
        with:
          name: wobbly-clock-debs
          path: ${{ runner.temp }}/debs/*.deb
