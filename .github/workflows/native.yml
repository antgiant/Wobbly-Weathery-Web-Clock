name: Native

# The native (Raspberry Pi) version: its command line is tested by the unit tests in ci.yml (tests/unit/native-*.test.mjs). This workflow adds
# what needs more tools: the man pages are linted with mandoc, and the command line is run for real. Runs only when native/, schema/ or the
# share-link code change.

on:
  push:
    paths: ['native/**', 'docs/LED-PANELS.md', 'schema/**', 'js/share.js', 'js/countdown.js', 'js/sky/dim.js', 'js/easing.js', 'js/config.js', 'tools/native-*.mjs', '.github/workflows/native.yml']
  pull_request:
    paths: ['native/**', 'docs/LED-PANELS.md', 'schema/**', 'js/share.js', 'js/countdown.js', 'js/sky/dim.js', 'js/easing.js', 'js/config.js', 'tools/native-*.mjs', '.github/workflows/native.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cli:
    name: Man pages and command line
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Man pages are current
        run: node tools/native-man.mjs --check
      - name: Lint the man pages
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq mandoc
          mandoc -Tlint -Wwarning native/man/wobbly-clock.1 native/man/wobbly-clock.conf.5
      - name: The command line runs
        env:
          WOBBLY_CONFIG: ${{ runner.temp }}/wc/wobbly-clock.conf
        run: |
          node native/cli/main.mjs --version
          node native/cli/main.mjs preset bedside
          node native/cli/main.mjs set hideSeconds on
          node native/cli/main.mjs get
          node native/cli/main.mjs capabilities
          mandoc -Tutf8 native/man/wobbly-clock.conf.5 | head -40

  core:
    name: Rust core (tests, and builds for every Pi)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The golden vectors and digit shapes are the web code's current ones
        run: |
          node tools/native-golden.mjs --check
          node tools/native-digits.mjs --check
      - name: Install the Rust targets
        run: rustup target add arm-unknown-linux-gnueabihf aarch64-unknown-linux-gnu
      - name: Tests (the Rust core agrees with the web code)
        run: cargo test --manifest-path native/Cargo.toml
      - name: Builds for the original Pi Zero (ARMv6) and for 64-bit Pis
        run: |
          cargo build --release --lib --manifest-path native/Cargo.toml --target arm-unknown-linux-gnueabihf
          cargo build --release --lib --manifest-path native/Cargo.toml --target aarch64-unknown-linux-gnu

  cross:
    name: The Pi binaries render the same frames (QEMU)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user
          rustup target add arm-unknown-linux-musleabihf aarch64-unknown-linux-musl
      - name: Static ARMv6 and aarch64 builds, run under emulation, frames compared byte for byte with the host build
        run: native/scripts/cross-check.sh

  matrix-sink:
    name: The panel program compiles against the hub75 library
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build hzeller/rpi-rgb-led-matrix and compile wobbly-matrix against its real header
        run: |
          git clone --depth 1 https://github.com/hzeller/rpi-rgb-led-matrix "$RUNNER_TEMP/hz"
          make -C "$RUNNER_TEMP/hz/lib" -j2
          cc -O2 -Wall -Wextra -o "$RUNNER_TEMP/wobbly-matrix" native/matrix-sink/wobbly-matrix.c \
            -I "$RUNNER_TEMP/hz/include" -L "$RUNNER_TEMP/hz/lib" -lrgbmatrix -lstdc++ -lm -lpthread
          ls -l "$RUNNER_TEMP/wobbly-matrix"

  package:
    name: The .deb builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: rustup target add arm-unknown-linux-musleabihf aarch64-unknown-linux-musl
      - name: Build both packages and look inside them
        run: |
          cargo build --release --manifest-path native/Cargo.toml --target arm-unknown-linux-musleabihf
          cargo build --release --manifest-path native/Cargo.toml --target aarch64-unknown-linux-musl
          native/scripts/make-deb.sh armhf native/target/arm-unknown-linux-musleabihf/release/wobbly-clock-run 0.0.0-ci "$RUNNER_TEMP/debs"
          native/scripts/make-deb.sh arm64 native/target/aarch64-unknown-linux-musl/release/wobbly-clock-run 0.0.0-ci "$RUNNER_TEMP/debs"
          for d in "$RUNNER_TEMP"/debs/*.deb; do dpkg-deb -I "$d" | head -8; dpkg-deb -c "$d" | grep -E "usr/bin|service"; done
