[workspace]
# core: the settings file, the LED panel mapping, gamma and the framebuffer bytes (small, tested); host: wobbly-clock-run, the program that runs the
# web page's own code. The host loads the GPU driver (EGL, OpenGL ES) at run time, so building it needs only a C compiler (for QuickJS).
members = ["core", "host"]
resolver = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
