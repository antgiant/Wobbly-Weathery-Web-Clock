[package]
name = "wobbly-clock-run"
version = "0.1.0"
edition = "2021"
description = "Runs the web page's own sky engine (JavaScript and GLSL, unmodified) without a browser: QuickJS, the Pi's GPU through EGL/GLES, direct display"
license = "MIT"
build = "build.rs"

[[bin]]
name = "wobbly-clock-run"
path = "src/main.rs"

[dependencies]
rquickjs = { version = "0.9", features = ["loader", "macro"] }
libloading = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tiny-skia = "0.11"
ab_glyph = "0.2"
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"
wobbly-core = { path = "../core" }

# rquickjs ships ready-made bindings for 64-bit Arm but not for 32-bit Arm: there they are generated while building (needs libclang)
[target.'cfg(target_arch = "arm")'.dependencies]
rquickjs = { version = "0.9", features = ["loader", "macro", "bindgen"] }
