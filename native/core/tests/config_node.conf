# wobbly-clock settings: the same names and values as the web page (see wobbly-clock.conf(5)).
twentyFourHourClock = off
hideSeconds = on
clockStyle = solid
brightnessDay = 0.9
brightnessNight = 0.3
brightnessTransition = 60
timeZone = America/Chicago
location_latitude = 41.88
location_longitude = -87.63
output = matrix
matrixConfig = /etc/wobbly-clock/matrix.cfg
